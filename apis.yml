aid: clevergy
name: Clevergy
description: >-
  Clevergy (The Clevergy Solution, SL) is a Madrid-based climate-tech SaaS company, founded in 2022,
  that sells white-label energy-management software to electricity and gas retailers, solar
  installers and energy advisors. Its platform ingests household consumption data — pulled directly
  from Spanish distributors and the Datadis smart-meter hub via the CUPS supply-point code, or from
  connected solar inverters and smart devices — and turns it into consumption analytics, invoice
  breakdowns, savings recommendations, appliance-level disaggregation, virtual battery and wallet
  balances, energy-community shares, and sales leads the retailer can act on. Integrators consume it
  two ways: the Connect API, a Swagger 2.0 REST API on connect.clever.gy with 83 operations spanning
  users, houses, contracts, invoices, tariffs, equipment, energy telemetry, tickets and sales
  opportunities; and a catalog of roughly thirty embeddable "microfrontend" web components that drop
  Clevergy's end-user experiences straight into the retailer's own app or webview, authenticated with
  a short-lived per-user JWT. Clevergy raised a €3.2M round in October 2025 co-led by Racine² (Serena
  and Makesense) and Axon Partners Group, with Satgana, Wayra and Angels participating.
