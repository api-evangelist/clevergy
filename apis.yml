- name: Clevergy Webhooks
  description: >-
    Outbound HTTP callbacks that notify an integrator in real time when a Clevergy lifecycle entity
    changes. Three event surfaces are documented — User, SalesOpportunity and Ticket — with CREATE,
    UPDATE and DELETE event types on sales opportunities and CREATE/UPDATE on tickets. Delivery is
    notification-only by design: the payload carries an identifier and the full object must then be
    read back from the Connect API. Endpoints are registered by Clevergy on request; the only
    authentication mechanism offered is a token in a query parameter on the integrator's own callback
    URL, with no signature header. No AsyncAPI document is published.
  humanURL: https://docs.clever.gy/webhooks/clevergy-webhooks
  baseURL: https://connect.clever.gy
