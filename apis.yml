apis:
- name: Clevergy Webhooks
  description: >-
    Outbound HTTP callbacks that notify an integrator in real time when a Clevergy lifecycle entity changes.
    Three event surfaces are documented — User, SalesOpportunity and Ticket — with CREATE, UPDATE and
    DELETE event types on sales opportunities and CREATE/UPDATE on tickets. Delivery is notification-only
    by design: the payload carries an identifier and the full object must then be read back from the Connect
    API. Endpoints are registered by Clevergy on request; the only authentication mechanism offered is
    a token in a query parameter on the integrator's own callback URL, with no signature header. No AsyncAPI
    document is published.
  humanURL: https://docs.clever.gy/webhooks/clevergy-webhooks
  baseURL: https://connect.clever.gy
  tags:
  - Webhook
  - Energy
  - Utilities
  tags_raw:
  - Webhooks
  - Energy
  - Utilities
  properties:
  - type: Webhooks
    url: asyncapi/clevergy-webhooks.yml
  - type: Documentation
    url: https://docs.clever.gy/webhooks/clevergy-webhooks
  - type: APIReference
    url: https://docs.clever.gy/webhooks/clevergy-webhooks
- name: Clevergy Microfrontends
  description: >-
    Roughly thirty embeddable UI components — custom elements (web components) rendering a React tree
    in an isolated container — that bring Clevergy's end-user energy experiences into an integrator's
    own website, app or webview. Grouped into four families: account setup and integrations (contract
    opportunity, invoices, invoice OCR, smart-meter/Datadis authorization, inverter and EV connection,
    virtual battery and wallet), energy insights (consumption breakdown, energy chart, invoice estimation,
    solar amortization and summary), optimization and recommendations (energy prices, tariff comparison,
    house comparison, recommendations, solar recommender, tips, alerts), and real-time monitoring and
    device control (power chart, battery, smart devices, solar real-time). Distributed as a single unpinned
    ES module from assets.clever.gy and authenticated with a short-lived per-user JWT passed on the element's
    data-token attribute.
  humanURL: https://docs.clever.gy/helpdesk/microfrontends-catalog
  baseURL: https://assets.clever.gy
  tags:
  - Embedded Components
  - Energy
  - Home Energy
  - White Label
