apis:
- name: Clevergy Connect API
  description: >-
    REST API that lets Clevergy customers build integrations with the Clevergy platform: manage end
    users and their houses, create and maintain electricity and gas contracts with their energy price
    tables, upload and OCR-analyse invoices, define custom tariffs, discover and link solar inverter
    installations, read energy, power, comparison and appliance-disaggregation telemetry, monitor and
    schedule home batteries, manage energy-community membership and shares, post virtual wallet (EUR)
    and virtual battery (kWh) balances, and work support tickets and sales opportunities. Published as
    a Swagger 2.0 document with 62 paths, 83 operations, 102 definitions and an operationId on every
    operation. Authentication is a tenant API key in the clevergy-api-key header; a separate operation
    exchanges it for a 1-hour per-user JWT for browser use. Access is sales-gated — keys are issued
    per environment on request.
  humanURL: https://docs.clever.gy/connect-api/clevergy-connect-api
  baseURL: https://connect.clever.gy
