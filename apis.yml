- name: Clevergy Microfrontends
  description: >-
    Roughly thirty embeddable UI components — custom elements (web components) rendering a React tree
    in an isolated container — that bring Clevergy's end-user energy experiences into an integrator's
    own website, app or webview. Grouped into four families: account setup and integrations (contract
    opportunity, invoices, invoice OCR, smart-meter/Datadis authorization, inverter and EV connection,
    virtual battery and wallet), energy insights (consumption breakdown, energy chart, invoice
    estimation, solar amortization and summary), optimization and recommendations (energy prices,
    tariff comparison, house comparison, recommendations, solar recommender, tips, alerts), and
    real-time monitoring and device control (power chart, battery, smart devices, solar real-time).
    Distributed as a single unpinned ES module from assets.clever.gy and authenticated with a
    short-lived per-user JWT passed on the element's data-token attribute.
  humanURL: https://docs.clever.gy/helpdesk/microfrontends-catalog
  baseURL: https://assets.clever.gy
