third_party_limits_note: >-
  The one place request limits ARE discussed in Clevergy's docs is upstream, not downstream: the
  Enphase inverter integration page states that Clevergy syncs Enphase data weekly by default and
  that increasing the frequency requires upgrading to an Enphase plan with higher request limits.
  That is a limit Enphase imposes on Clevergy, recorded here so it is not mistaken for a Clevergy
  API limit. Source:
  https://docs.clever.gy/helpdesk/integrations/inverters/enphase

provider_action: >-
  The cheapest fix available to Clevergy on this artifact: declare a 429 response with a
  Retry-After header in the OpenAPI and publish the per-key limit. The API is already gated on a
  commercially issued tenant key, so the limit is presumably known internally — it is simply not
  written down where a caller can read it.
