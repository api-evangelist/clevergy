description: >-
  Recorded ABSENCE. Clevergy publishes no rate limits for the Connect API, declares no 429
  response on any of its 83 operations, and documents no rate-limit response headers. An agent or
  integrator has no runtime signal for how hard it may call, and no documented backoff contract.
