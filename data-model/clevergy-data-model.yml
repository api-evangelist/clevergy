generated: '2026-08-17'
method: derived
source: >-
  openapi/clevergy-connect-api-openapi.yml (102 definitions, $ref links and id-reference fields)
  enriched from https://docs.clever.gy/developer/getting-started/entities, which publishes the
  canonical entity/cardinality table.
description: >-
  The Clevergy domain graph. Clevergy's own documentation names six core entities and their
  cardinalities; the spec's 102 definitions resolve into those plus the energy/telemetry,
  tariff, ticketing and sales-opportunity satellites. The organising fact is that a HOUSE (a
  dwelling, addressed by a Spanish CUPS supply-point code) is the hub — energy data, contracts,
  equipment, settings and community membership all hang off houseId, while the USER is the
  identity that owns houses.

published_entity_table:
  source: https://docs.clever.gy/developer/getting-started/entities
  rows:
  - entity: User
    relation: 1 User ↔ n Houses
    features: Manages houses, receives notifications, and accesses support
  - entity: House
    relation: n Houses ↔ 1 Contract
    features: Controls energy, configures alerts, and generates leads
  - entity: Contract
    relation: 1 Contract ↔ 1 House
    features: Defines management terms for the house
  - entity: Invoices
    relation: n Invoices ↔ 1 House
    features: Tracks financial transactions related to the house
  - entity: Integrations
    relation: 1 Integration ↔ n Installations
    features: Connects external systems for monitoring and control
  - entity: Installation
    relation: 1 Installation ↔ 1 House
    features: Connects installation with house to show your user the energy data

entities:
- name: User
  schemas: [User, UserCreated, UserRegistration, UpdateUser, UsersPageElement, AuthUser]
  identifier: userId
  alternate_identifiers:
  - externalUserId (the integrator's own id, assignable via assignExternalUserIdToUser)
  - email
  - nif (Spanish tax id)
  operations: [createUser, getUser, getUsers, updateUser, deleteUserAccount, authorizeUser]
- name: House
  schemas: [House, HouseCreated, UpdateHouse, HouseDetail, HousesPage, UserHouseWithIntegrations]
  identifier: houseId
  domain_key: CUPS (supply-point code) via SupplyPoint
  operations: [createHouse, getTenantHouses, getHouseDetail, updateHouse, deleteHouse, getUserSupplies]
  note: The hub entity — energy, power, equipment, settings and disaggregation are all house-scoped.
- name: SupplyPoint
  schemas: [SupplyPoint]
  identifier: cups
  belongs_to: House
- name: ElectricityContract
  schemas: [ElectricityContract, ElectricityContractRequest]
  identifier: contractId
  alternate_identifiers: [externalContractId, connectionContractId]
  operations:
  - createElectricityContract
  - getElectricityContract
  - getUserElectricityContracts
  - updateElectricityContract
  - deleteElectricityContract
- name: GasContract
  schemas: [GasContract, GasContractRequest]
  identifier: contractId
  operations: [createGasContract, getGasContract, getUserGasContracts, updateGasContract, deleteGasContract]
- name: HouseContract
  schemas: [HouseContractDetail, CreateHouseContract]
  status: deprecated
  note: >-
    The house-scoped contract model, superseded by the user-scoped electricity/gas split. See
    lifecycle/clevergy-lifecycle.yml.
- name: Invoice
  schemas: [Invoice, CreateOrUpdateInvoiceRequest, CreateHouseInvoice]
  identifier: id
  types: [ELECTRICITY, GAS, OTHER]
  operations: [createInvoice, getInvoiceById, getInvoicesByContract, getInvoicesByUser, updateInvoice, deleteInvoice]
  upload: >-
    createInvoice returns a signed fileUrl valid 15 minutes; the PDF must be PUT to it or the
    invoice is never processed.
- name: InvoiceAnalysis
  schemas: [InvoiceAnalysis, InvoiceAnalysisId, AnalyzeInvoice]
  identifier: invoiceAnalysisId
  operations: [analyzeInvoice, getInvoiceAnalysisById, getInvoiceTariffs]
  note: OCR extraction of a bill; yields candidate tariffs.
- name: Tariff
  schemas: [Tariff, CreateTariff, TariffEnergyPrice, TariffEnergyPrices, InvoiceTariff, InvoiceTariffs]
  identifier: tariffId
  operations: [createTariff, getTariff, getTariffs, updateTariff, deleteTariff, setTariffEnergyPrices]
- name: Integration
  schemas: [HouseIntegration, HouseIntegrations, UpdateDatadisIntegrationStatus, IntegrateSmartmeter]
  identifier: integrationId
  vendors_in_schema: [enodeB2C, froniusB2C, huaweiB2C, shelly, smaB2C, sungrowB2C, wibeeeSolar]
  note: >-
    The HouseIntegrations schema enumerates the connected-vendor slots as named properties rather
    than a list, so the set of supported vendors is baked into the contract shape.
- name: Installation
  schemas: [Installation, InstallationList, UpdateInstallation, ConnectInstallationRequest]
  identifier: installationId
  alternate_identifiers: [plantCode, name, vendorId]
  operations: [getInstallations, connectInstallation, updateInstallation]
- name: Equipment
  schemas: [Equipment, EquipmentsPage, HouseEquipment, HouseEquipments, StorageEquipment, StorageEquipmentSoc]
  identifier: equipmentId
  operations:
  - getTenantEquipments
  - getHouseEquipments
  - getStorageEquipment
  - getStorageEquipmentSoc
  - scheduleStorageEquipmentAction
- name: EnergyCommunity
  schemas: [EnergyCommunityHouse, EnergyCommunityPower]
  identifier: energyCommunityId
  operations: [assignHouseToEnergyCommunity, updateEnergyCommunityHouseShare, removeEnergyCommunityHouseFromInstallation]
- name: Ticket
  schemas: [Ticket, UpdateTicketRequest, Comment, CommentRequest, CommentAttachmentRequest, CommentAttachmentUrl]
  identifier: ticketId
  operations: [getTicketDetails, updateTicket, addCommentToTicket, createCommentAttachmentSignedUrl]
- name: SalesOpportunity
  schemas: [SalesOpportunitySummary, SalesOpportunitiesPage, ContractSalesOpportunity, PatchContractSalesOpportunityRequest]
  identifier: id
  operations: [getSalesOpportunities, getContractSalesOpportunity, patchContractSalesOpportunity, deleteSalesOpportunity]
- name: VirtualBalance
  schemas: [UserVirtualWalletTransaction, UserVirtualBatteryTransaction]
  operations: [createVirtualWalletTransaction, createVirtualBatteryTransaction]
  units: {wallet: EUR, battery: kWh}
- name: Energy
  schemas: [EnergyItem, EnergyEntry, HouseConsumption, HouseDataConsumption, UserConsumptionCategory, EnergyComparison, StoreHouseEnergiesRequest]
  operations: [getEnergyByHouseId, getEnergyComparison, storeHouseEnergies]
- name: Power
  schemas: [PowerItem, SmartDevicesPower]
  operations: [getPowerByHouseId]
- name: Disaggregation
  schemas: [HouseDisaggregation, DisaggregationDevice]
  operations: [getDisaggregationByHouse]
- name: Connection
  schemas: [Connection, ConnectionResponse]
  identifier: connectionId
  operations: [getConnection]
  note: The tenant's own connection record; contracts carry connectionId + connectionContractId.

