multi_tenancy:
  model: tenant
  evidence:
  - Ticket.tenantId is a first-class field on the ticket schema.
  - getTenantHouses and getTenantEquipments are tenant-wide collection reads.
  - The API key is scoped per tenant/environment.
  - >-
    The hosted webview is served on a per-tenant subdomain
    (https://{tenant_name}.clever.gy/login-with-token).

