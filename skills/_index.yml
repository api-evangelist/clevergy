cross_cutting_rules_every_skill_repeats:
- >-
  Auth is a tenant API key in the clevergy-api-key header, server-side only. Browser surfaces get a
  1-hour user JWT minted by retrieveUserAccessToken instead.
- >-
  There is NO idempotency mechanism. Duplicate creates surface as 409 Conflict on eight operations
  and are undetectable on the rest. Every skill that writes says so at the point of the write.
- >-
  Two error envelope shapes must both be parsed: {timestamp,status,error,path} on named 4xx and
  {code,message} on the default catch-all.
- >-
  Two pagination models coexist (page/size vs cursor/limit) and differ per resource.
- >-
  No 429 is declared and no rate limits are published, so callers must self-throttle.
- >-
  Signed-URL uploads (invoices, ticket attachments) fail silently if the file is never PUT — always
  verify.

