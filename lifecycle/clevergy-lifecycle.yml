description: >-
  Versioning, deprecation and operational-transparency posture of the Clevergy Connect API. The
  honest headline: Clevergy signals deprecation inside the specification (a deprecated tag group
  plus one flagged operation) but publishes no deprecation POLICY, no dated changelog, no status
  page and no SLA. Absences below are recorded, not inferred.

versioning:
  scheme: none-in-path
  current: 1.0.0
  source: info.version in openapi/clevergy-connect-api-openapi.yml
  policy_url: null
  detail: >-
    Paths are unversioned (https://connect.clever.gy/users). There is no version header, no date
    pinning, and no documented version-negotiation mechanism. Breaking changes are instead
    absorbed by publishing a replacement operation and marking the old one deprecated in the
    spec.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: null
  sunset_header_documented: false
  signalled_in_spec: true
  mechanism: >-
    Deprecation is communicated two ways in the spec: (1) tag groups literally named
    "Contracts - Deprecated" and "Invoices - Deprecated" that hold the superseded house-scoped
    operations, and (2) the OpenAPI `deprecated: true` flag on one operation. No timeline,
    notice period, Sunset/Deprecation response header (RFC 8594), or removal date is published
    for any of them.
  note: >-
    No `Deprecation` pointer is claimed in apis.yml: a deprecated tag group is evidence that
    deprecations happen, not evidence of a published deprecation policy.

deprecated_operations:
- operationId: getUserHouses
  path: GET /users/{userId}/houses
  signal: openapi deprecated flag
  replacement: getUserSupplies (GET /users/{userId}/supplies)
  source: openapi/clevergy-connect-api-openapi.yml

deprecated_groups:
- tag: Contracts - Deprecated
  operations: 7
  operation_ids:
  - createHouseContract
  - getHouseContractById
  - getHouseContractEnergyPrices
  - addHouseContractEnergyPrices
  - getHouseContractIdByExternalId
  - getLastHouseContract
  - assignExternalContractIdToContract
  supersession: >-
    House-scoped contract operations (/houses/{houseId}/contracts/...) superseded by the
    user-scoped, fuel-typed operations under Contracts|Electricity and Contracts|Gas
    (/users/{userId}/electricity-contracts, /users/{userId}/gas-contracts) plus the
    user-scoped energy-prices pair under the Contracts tag.
  source: openapi/clevergy-connect-api-openapi.yml
- tag: Invoices - Deprecated
  operations: 2
  operation_ids:
  - createHouseInvoice
  - deleteHouseInvoice
  supersession: >-
    House-scoped invoice operations (/houses/{houseId}/invoices) superseded by the
    contract-scoped invoice operations (/contracts/{contractId}/invoices) under the Invoices tag.
  source: openapi/clevergy-connect-api-openapi.yml

deprecated_components:
- element: clevergy-consumption-cumulative
  kind: microfrontend
  replacement: clevergy-invoice-estimation
  statement: >-
    "It replaces the older Consumption cumulative module, which will be progressively deprecated
