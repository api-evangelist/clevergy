note: >-
  Recorded as two plans with null prices rather than plan_count 0, because the tier structure
  itself IS published — Clevergy documents different onboarding flows per plan, so an integrator
  can tell which capabilities sit behind which tier. What is missing is the money. Third-party
  pricing quotes were deliberately not used: only what Clevergy publishes about itself counts.
  A related third-party plan dependency is worth noting for buyers: the Enphase inverter
  integration's data freshness depends on the CUSTOMER's own Enphase plan (Clevergy syncs weekly
  by default and states that higher-frequency updates require an Enphase plan with higher request
  limits) — that is Enphase's rate card, not Clevergy's.
