generated: '2026-08-17'
method: searched
source: https://docs.clever.gy/developer/microfrontends
docs: https://docs.clever.gy/helpdesk/microfrontends-catalog
description: >-
  Clevergy's primary integration surface for end-user experiences is not an SDK — it is a
  catalog of embeddable "microfrontends": custom elements (web components) that render a React
  tree inside a shadow-styled container and fetch their own data directly from the Clevergy
  API. Every element is defined by a single ES-module loader script; the integrator drops a tag
  into their own page or webview and passes parameters as data-* attributes. This artifact
  records the published catalog. It is distinct from packages/ (distribution) and from
  openapi/ (the server contract the components call).

loader:
  type: es-module script tag
  url: https://assets.clever.gy/clevergy-modules.js
  markup: <script type="module" src="https://assets.clever.gy/clevergy-modules.js"></script>
  placement: inside <head>
  pinned: false
  note: >-
    The distribution URL carries no version segment or query, so a consumer always receives
    whatever build is currently in the bucket. Observed Last-Modified on 2026-08-17 was
    2026-08-17T10:12:50 GMT with Cache-Control max-age=60 — i.e. the bundle is rebuilt and
    republished frequently and there is no way for an integrator to pin a known-good version.
  size_bytes: 592093
  probe:
    url: https://assets.clever.gy/clevergy-modules.js
    http_status: 200
    content_type: text/javascript
    fetched: '2026-08-17'

authentication:
  mechanism: data-token attribute carrying a Clevergy user JWT
  minted_by: retrieveUserAccessToken (GET /auth/{userId}/token on the Connect API)
  ttl: 3600
  note: >-
    Not every component requires a token — unauthenticated ones (e.g. energy prices) render
    public data. Components that read user-owned data require the JWT. The docs are explicit
    that the integrator's own backend must mint the JWT with the API key; the API key must
    never be exposed to the browser.
  detail: authentication/clevergy-authentication.yml

styling:
  mechanism: CSS custom properties, all prefixed --clevergy to avoid collisions
  isolation: >-
    Host page CSS does not affect the component and component CSS does not leak out.
  common_variables:
  - --clevergy-font-family
  - --clevergy-color-primary
  - --clevergy-color-secondary
  - --clevergy-color-text
  - --clevergy-color-subtext
  - --clevergy-color-unselected
  - --clevergy-color-border
  - --clevergy-module-header-title-color
  - --clevergy-module-header-action-color
  - --clevergy-module-container-background

events:
  supported: true
  description: >-
    Components can emit DOM events to notify the host application of things that happened
    inside them; per-component events are documented in the catalog entry for each element.

