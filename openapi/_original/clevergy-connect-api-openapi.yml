  /sales-opportunities:
    get:
      summary: List sales opportunities
      description: |
        Returns a paginated list of sales opportunities for the tenant.
        Currently only CONTRACT opportunities are returned.
        Results are sorted by createdAt descending.
      tags:
        - Sales Opportunities
      operationId: getSalesOpportunities
      parameters:
        - name: page
          in: query
          description: Number of the page starting at 1
          required: false
          type: integer
          format: int32
          default: 1
        - name: size
          in: query
          description: Size of the page (max 100)
          required: false
          type: integer
          format: int32
          default: 10
        - name: status
          in: query
          description: Filter by status. Multiple values can be comma-separated.
          required: false
          type: string
          enum:
            - STARTED
            - POTENTIAL
            - FORMALIZED
            - CONVERTED
            - REJECTED
        - name: product
          in: query
          description: |
            Filter by product. Currently only CONTRACT is supported; other values return 400.
          required: false
          type: string
          enum:
            - CONTRACT
      responses:
        '200':
          description: Paginated list of sales opportunities
          schema:
            $ref: '#/definitions/SalesOpportunitiesPage'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/HttpErrorBadRequest'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/HttpErrorUnauthorized'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /sales-opportunities/contract/{id}:
    get:
      summary: Get contract sales opportunity details
      description: |
        Returns the details of a CONTRACT sales opportunity, including contracting
        payload fields (contact data, CUPS, IBAN, invoice references, etc.).
        Returns 404 if the opportunity does not exist or is not a CONTRACT product.
      tags:
        - Sales Opportunities
      operationId: getContractSalesOpportunity
      parameters:
        - name: id
          in: path
          description: Sales opportunity ID
          required: true
          type: string
      responses:
        '200':
          description: Contract sales opportunity details
          schema:
            $ref: '#/definitions/ContractSalesOpportunity'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/HttpErrorUnauthorized'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/HttpErrorNotFound'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    patch:
      summary: Update contract sales opportunity status
      description: |
        Partially updates a CONTRACT sales opportunity. Currently only the status
        field is supported. Returns the updated opportunity.
        Returns 404 if the opportunity does not exist or is not a CONTRACT product.
      tags:
        - Sales Opportunities
      operationId: patchContractSalesOpportunity
      parameters:
        - name: id
          in: path
          description: Sales opportunity ID
          required: true
          type: string
        - name: patchContractSalesOpportunityRequest
          in: body
          description: Fields to update
          required: true
          schema:
            $ref: '#/definitions/PatchContractSalesOpportunityRequest'
      responses:
        '200':
          description: Updated contract sales opportunity
          schema:
            $ref: '#/definitions/ContractSalesOpportunity'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/HttpErrorBadRequest'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/HttpErrorUnauthorized'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/HttpErrorNotFound'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /sales-opportunities/{id}:
    delete:
      summary: Delete a sales opportunity
      description: |
        Hard-deletes a sales opportunity. Currently only CONTRACT opportunities are
        supported; other products return 404. Related notes are removed by cascade.
        Emits a Pub/Sub DELETE event (tenant webhooks are not notified for DELETE).
      tags:
        - Sales Opportunities
      operationId: deleteSalesOpportunity
      parameters:
        - name: id
          in: path
          description: Sales opportunity ID
          required: true
          type: string
      responses:
        '200':
          description: Deleted contract sales opportunity
          schema:
            $ref: '#/definitions/ContractSalesOpportunity'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/HttpErrorUnauthorized'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/HttpErrorNotFound'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
