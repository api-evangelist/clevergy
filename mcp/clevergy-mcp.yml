description: >-
  Clevergy ships NO MCP server. This is a DERIVED CANDIDATE tool surface, computed from the 83
  operations of the published Connect API OpenAPI so the shape of an agent-facing Clevergy is
  visible and so the provider can see what it would take. Nothing here is deployed and no
  endpoint exists — see deployment.mode: none.

